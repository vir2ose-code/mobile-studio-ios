name: Build iOS & iPadOS .ipa (Mobile Studio)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Mobile Studio .ipa (Sideloadly & AltStore Ready)
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Build Application with Xcode
        run: |
          xcodebuild -project MobileStudio.xcodeproj \
            -scheme MobileStudio \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa for Sideloadly
        run: |
          mkdir -p package_ipa/Payload
          APP_DIR=$(find build -name "MobileStudio.app" -type d | head -n 1)
          echo "Found app at: $APP_DIR"
          cp -R "$APP_DIR" package_ipa/Payload/
          cd package_ipa
          zip -qr ../MobileStudio_Pro_iOS.ipa Payload
          cd ..
          ls -lh MobileStudio_Pro_iOS.ipa

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileStudio_Pro_iOS_ipa
          path: MobileStudio_Pro_iOS.ipa
          retention-days: 14
